<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Merci de suivre La Présidentielle Inversée.">
  <title>Merci | La Présidentielle Inversée</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      background: #102A43;
      color: #fff;
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .page {
      width: min(1120px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 40px;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .14);
    }

    .brand {
      display: inline-block;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: auto;
      height: 28px;
    }

    main {
      align-self: center;
      padding: 64px 0;
      max-width: 860px;
    }

    .eyebrow {
      margin: 0;
      color: #F9E071;
      font-family: "Archivo", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 24px 0 0;
      font-family: "Archivo", system-ui, sans-serif;
      font-size: clamp(52px, 8vw, 88px);
      font-weight: 900;
      letter-spacing: -.05em;
      line-height: .98;
      text-wrap: balance;
    }

    h1 span { color: #FBB1D7; }

    .message {
      max-width: 49ch;
      margin: 28px 0 0;
      color: rgba(255, 255, 255, .84);
      font-size: clamp(18px, 2.2vw, 23px);
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 34px;
      padding: 16px 24px;
      background: #FBB1D7;
      color: #102A43;
      font-family: "Archivo", system-ui, sans-serif;
      font-weight: 800;
      text-decoration: none;
    }

    .button:hover { background: #fff; }

    .button:focus-visible,
    .brand:focus-visible {
      outline: 3px solid #F9E071;
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      .page { padding: 0 22px; }
      main { padding: 48px 0; }
      h1 { font-size: clamp(46px, 15vw, 68px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="Retour à l'accueil de La Présidentielle Inversée">
        <img src="/logo.svg" alt="La Présidentielle Inversée">
      </a>
    </header>

    <main>
      <p class="eyebrow">Présidentielle 2027</p>
      <h1>Merci, c'est noté<span> !</span></h1>
      <p class="message">
        Votre adresse email est bien enregistrée. Nous vous écrirons pour vous tenir au courant des prochaines étapes du projet.
      </p>
      <a class="button" href="/">Retour à l'accueil</a>
    </main>
  </div>
</body>
</html>
