<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>La Présidentielle Inversée — présentation du projet</title>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          background: #102A43;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #__bundler_loading {
          position: fixed;
          bottom: 20px;
          right: 20px;
          font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
          color: #666;
          background: #fff;
          padding: 8px 14px;
          border-radius: 8px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          z-index: 10000;
      }

      #__bundler_thumbnail {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #102A43;
          z-index: 9999;
      }

      #__bundler_thumbnail svg {
          width: 100%;
          height: 100%;
          object-fit: contain;
      }

      #__bundler_placeholder {
          color: #999;
          font-size: 14px;
      }
  </style>
  <noscript>
    <style>#__bundler_loading {
        display: none;
    }</style>
    <div
      style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<form name="inscription-organisations" method="POST" action="/thanks.html" data-netlify="true" data-netlify-honeypot="bot-field-organisations" hidden>
  <input type="hidden" name="origine" value="contacts-organisations">

</form>
<form name="contact" method="POST" action="/thanks.html" data-netlify="true" data-netlify-honeypot="bot-field-citoyens" hidden>
  <input type="hidden" name="origine" value="contacts-citoyens">
  <input name="email" type="email">
  <input name="bot-field-citoyens" type="text">
</form>

<script>

  document.addEventListener('DOMContentLoaded', async function() {
    const loading = document.getElementById('__bundler_loading')

    function setStatus(msg) {
      if (loading) loading.textContent = msg
    }

    const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i
    const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/

    function toBase64(bytes) {
      let bin = ''
      for (let i = 0; i < bytes.length; i += 0x8000) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
      }
      return btoa(bin)
    }

    // Error sink persists across replaceWith since it's on window, not the DOM.
    window.addEventListener('error', function(e) {
      // Failed resource loads (CSP-blocked links, scripts, images) fire plain
      // events at the element — warn only; real JS errors carry message/error.
      if (!e.message && !e.error && e.target && e.target !== window) {
        console.warn('[bundle] resource failed to load:',
          e.target.tagName, String(e.target.src || e.target.href || ''))
        return
      }
      var p = document.body || document.documentElement
      var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'))
      d.id = '__bundler_err'
      d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto'
      d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
        '[bundle] ' + (e.message || e.type) +
        (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '')
    }, true)

    try {
      const manifestEl = document.querySelector('script[type="__bundler/manifest"]')
      const templateEl = document.querySelector('script[type="__bundler/template"]')
      if (!manifestEl || !templateEl) {
        setStatus('Error: missing bundle data')
        console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl)
        return
      }

      const manifest = JSON.parse(manifestEl.textContent)
      let template = JSON.parse(templateEl.textContent)
        .replaceAll('action="/" data-netlify', 'action="/thanks.html" data-netlify')
        .replaceAll('name="inscription-citoyens"', 'name="contact"')
        .replaceAll('value="inscription-citoyens"', 'value="contact"')
        .replaceAll(' data-netlify-form="true"', '')
        .replace(/ data-success-message="[^"]*"/g, '')
        .replace(/\s*<p data-form-status="true"[\s\S]*?<[/]p>/g, '')
        .replace(/\n<script>\n[(][(][)] => [{]\n  const errorMessage = [\s\S]*?<[/]script>/, '')

      // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
      // document's manifest; frame srcs carry an about:blank#<uuid> marker
      // instead of a substitutable uuid. Every document mints the blobs for
      // its OWN frames — from local text at the root, or text obtained from
      // its DIRECT parent over the relay protocol below — so each frame
      // navigation stays same-origin with its initiator and a deduped page
      // loads at any depth on any host, including a file:// download's
      // opaque origins (where a blob minted by one document cannot be
      // navigated to by another).
      const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]')
      const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : []
      const pageSet = new Set(pageOrder)
      const pageTexts = {}

      // ── Nested-page text protocol (parent-chain relay) ──
      // Page bundles ship once, in the ROOT document's manifest. Every
      // document mints the blobs for its OWN frames, obtaining page text
      // through a strict parent-chain relay: a document only ever SENDS to
      // its direct parent (which, for every document the publisher's own
      // runtime minted, is another publisher document) and only ACCEPTS
      // text from that direct parent; requests from below are honored only
      // for the document's own child frames, and the ROOT never sends
      // upward at all. That last rule is load-bearing: the artifact host's
      // frame-ancestors allows claude.ai (and friends) to frame an
      // artifact, so window.top can be a FOREIGN document — a top-addressed
      // protocol would hand page uuids to that ancestor and accept forged
      // "page text" from it, minting attacker HTML as an artifact-origin
      // blob document. The chain never touches the ancestor: requests stop
      // at the root, replies are origin-addressed per hop (never '*' when
      // an origin exists), and both directions are origin-gated (on https
      // a foreign sender's origin can never equal this document's; in
      // opaque contexts — file:// — everything serializes as 'null', where
      // an embedded EXTERNAL frame still fails the gate by carrying its
      // own real origin, and a sandboxed child of such a frame is excluded
      // by the own-child-frames check plus uuid unguessability). Shape is
      // deny-by-default: one request form, one reply form, no error
      // replies.
      // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
      // contexts such as a sandboxed preview iframe) — location.origin is
      // computed from the URL and stays 'https://…' even when the document
      // is sandboxed, which would misgate every opaque chain.
      const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
        ? window.origin
        : '*'

      function trustedOrigin(e) {
        if (e.origin === window.origin) return true // https chains; opaque==opaque
        // file:// trees: Chrome serializes the file document's origin as
        // 'file://' while the blob: documents it mints serialize as 'null',
        // so the two legitimate shapes can never string-match — accept the
        // pair in both directions. https origins never serialize as either,
        // and sender identity (own child frame / direct parent) is checked
        // separately.
        return (
          (e.origin === 'null' &&
            (window.origin === 'file://' ||
              window.location.protocol === 'file:')) ||
          (/^file:/.test(e.origin) && window.origin === 'null')
        )
      }

      // Non-empty only in the root document (nested bundles ship an empty
      // island), so it doubles as the root marker: the root answers from
      // local text and treats a miss as authoritative — never relaying to
      // its (possibly foreign) parent.
      const isPageRoot = pageOrder.length > 0
      const blobUrls = {}
      const resourceBlobs = {}
      const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/
      const pendingFrames = {} // uuid -> [{el, frag}] awaiting text for own frames
      const pendingRelays = {} // uuid -> [childWindow] awaiting text to pass down
      function mountPage(el, frag, text) {
        const pageBlob = new Blob([text], { type: 'text/html' })
        const u = URL.createObjectURL(pageBlob)
        resourceBlobs[u] = pageBlob
        el.src = u + frag
      }

      function deliverPage(uuid, text) {
        const frames = pendingFrames[uuid]
        delete pendingFrames[uuid]
        if (frames) for (const f of frames) mountPage(f.el, f.frag, text)
        const relays = pendingRelays[uuid]
        delete pendingRelays[uuid]
        if (relays) {
          for (const cw of relays) {
            try {
              cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET)
            } catch (err) { /* gone */
            }
          }
        }
      }

      function ownFrameWindows() {
        const out = []
        for (const f of Array.from(document.querySelectorAll('iframe'))) {
          try {
            if (f.contentWindow) out.push(f.contentWindow)
          } catch (err) { /* detached */
          }
        }
        return out
      }

      window.addEventListener('message', function(e) {
        const d = e.data
        if (!d || typeof d !== 'object' || !e.source) return
        // Origin gate first; the structural checks below (own-child-frames
        // for requests, direct-parent + solicited-uuid for replies, the
        // root's never-relay rule) are what hold in fully opaque chains
        // where origin strings can't discriminate — a sandboxed root's
        // FOREIGN wrapper still fails all three even though both serialize
        // as real-vs-'null' rather than matching.
        if (!trustedOrigin(e)) return
        if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
          // Requests are honored only for this document's own child frames.
          if (ownFrameWindows().indexOf(e.source) < 0) return
          const uuid = d.__bundler_need
          const text = pageTexts[uuid]
          if (typeof text === 'string') {
            try {
              e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET)
            } catch (err) { /* gone */
            }
            return
          }
          if (isPageRoot || window.parent === window) return // authoritative miss
          const waiting = pendingRelays[uuid]
          if (waiting) {
            if (waiting.indexOf(e.source) < 0) waiting.push(e.source)
            return
          }
          // Never-answered uuids would otherwise accumulate forever under a
          // request spray; past the cap (far above any real page count) new
          // relays are dropped rather than remembered.
          if (Object.keys(pendingRelays).length >= 128) return
          pendingRelays[uuid] = [e.source]
          window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET)
        } else if (
          typeof d.__bundler_page === 'string' &&
          UUID_SHAPE.test(d.__bundler_page) &&
          typeof d.__bundler_text === 'string'
        ) {
          // The shape test is load-bearing beyond tidiness: the solicited
          // check below uses the in operator, which matches prototype keys
          // ('__proto__', 'constructor') — an unshaped key would reach
          // deliverPage and throw, painting the error banner.
          // Text is accepted only from the direct parent — the document
          // that minted this one.
          if (e.source !== window.parent || window.parent === window) return
          if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return
          deliverPage(d.__bundler_page, d.__bundler_text)
        }
      })

      const uuids = Object.keys(manifest)
      setStatus('Unpacking ' + uuids.length + ' assets...')

      await Promise.all(uuids.map(async (uuid) => {
        const entry = manifest[uuid]
        try {
          const binaryStr = atob(entry.data)
          const bytes = new Uint8Array(binaryStr.length)
          for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i)

          let finalBytes = bytes
          if (entry.compressed) {
            if (typeof DecompressionStream !== 'undefined') {
              const ds = new DecompressionStream('gzip')
              const writer = ds.writable.getWriter()
              const reader = ds.readable.getReader()
              writer.write(bytes)
              writer.close()
              const chunks = []
              let totalLen = 0
              while (true) {
                const { done, value } = await reader.read()
                if (done) break
                chunks.push(value)
                totalLen += value.length
              }
              finalBytes = new Uint8Array(totalLen)
              let offset = 0
              for (const chunk of chunks) {
                finalBytes.set(chunk, offset)
                offset += chunk.length
              }
            } else {
              console.warn('DecompressionStream not available, asset ' + uuid + ' may not render')
            }
          }

          if (pageSet.has(uuid)) {
            pageTexts[uuid] = new TextDecoder().decode(finalBytes)
            return
          }
          if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
            // Strict artifact hosts allow font-src data: but not blob:.
            blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
              (entry.compressed ? toBase64(finalBytes) : entry.data)
          } else {
            const blob = new Blob([finalBytes], { type: entry.mime })
            blobUrls[uuid] = URL.createObjectURL(blob)
            resourceBlobs[blobUrls[uuid]] = blob
          }
        } catch (err) {
          console.error('Failed to decode asset ' + uuid + ':', err)
          const blob = new Blob([], { type: entry.mime })
          blobUrls[uuid] = URL.createObjectURL(blob)
          resourceBlobs[blobUrls[uuid]] = blob
        }
      }))

      const extResEl = document.querySelector('script[type="__bundler/ext_resources"]')
      const extResources = extResEl ? JSON.parse(extResEl.textContent) : []
      const resourceMap = {}
      for (const entry of extResources) {
        if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid]
      }

      // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
      // consumers read these Blobs directly. Survives the swap like the error sink.
      window.__resourceBlobs = resourceBlobs

      setStatus('Rendering...')
      // Page uuids have no blob here — they ride inside about:blank#<uuid>
      // frame markers the pass below resolves after the swap.
      for (const uuid of uuids) {
        if (pageSet.has(uuid)) continue
        template = template.split(uuid).join(blobUrls[uuid])
      }

      // Strip integrity + crossorigin — blob URLs from a file:// document inherit
      // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
      // The manifest bytes are ours; SRI protects against CDN compromise, not this.
      template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '')

      const resourceScript = '<script>window.__resources = ' +
        JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
        ';</' + 'script>'
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag. slice() rather than
      // replace() keeps us clear of $-pattern substitution in resourceScript.
      const headOpen = template.match(/<head[^>]*>/i)
      if (headOpen) {
        const i = headOpen.index + headOpen[0].length
        template = template.slice(0, i) + resourceScript + template.slice(i)
      }

      // Parse the template and swap the root element. Scripts inserted via
      // DOMParser/replaceWith are inert per spec — re-create each with
      // createElement so they execute, awaiting onload for src scripts to
      // preserve ordering (React before ReactDOM before Babel before text/babel).
      const doc = new DOMParser().parseFromString(template, 'text/html')
      document.documentElement.replaceWith(doc.documentElement)

      // Resolve page-frame markers: mint this document's own blob for each
      // framed page — from local text when this is the root, otherwise by
      // asking the direct parent over the relay protocol above. An
      // unanswered request leaves the frame on about:blank, the same
      // degraded state as a refused embed.
      {
        const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/
        const needed = []
        for (const el of Array.from(document.querySelectorAll('iframe'))) {
          const m = MARKER.exec(el.getAttribute('src') || '')
          if (!m) continue
          const text = pageTexts[m[1]]
          if (typeof text === 'string') {
            mountPage(el, m[2] || '', text)
          } else if (window.parent !== window && !isPageRoot) {
            const had = pendingFrames[m[1]];
            (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' })
            if (!had) needed.push(m[1])
          }
        }
        for (const uuid of needed) {
          window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET)
        }
      }

      const dead = Array.from(document.scripts)
      for (const old of dead) {
        const s = document.createElement('script')
        for (const a of old.attributes) s.setAttribute(a.name, a.value)
        s.textContent = old.textContent
        // text/babel scripts with a src: read and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          const pre = resourceBlobs[s.src.split('#')[0]]
          s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text()
          s.removeAttribute('src')
        }
        const p = s.src ? new Promise(function(r) {
          s.onload = s.onerror = r
        }) : null
        old.replaceWith(s)
        if (p) await p
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags()
      }
    } catch (err) {
      setStatus('Error unpacking: ' + err.message)
      console.error('Bundle unpack error:', err)
    }
  })

</script>

"<!DOCTYPE html>\n  <html>  <head>\n    <meta charset=\"utf-8\">    \n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">    \n\n\n\n    <script src=\"50bbc12b-ddaa-412d-b643-2bcd5a2d57e9\">      <\u002Fscript >\n </head>\n <body>\n <x-dc>\n <helmet>\n <title>La Présidentielle Inversée — présentation du projet</title>\n <meta name=\"description\" content=\"En 2027, ne demandez pas le programme. Faites-le. Les organisations qui font vivre le pays déposent leurs solutions, les citoyens les priorisent, les candidats s'engagent. Un projet du collectif Politique inversée.\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:title\" content=\"En 2027, ne demandez pas le programme. Faites-le !\">\n<meta property=\"og:description\" content=\"Pour la première fois dans une élection présidentielle : la société civile dépose ses solutions, les citoyens votent pour celles qui comptent, les candidats répondent. Les priorités d'abord, le candidat ensuite.\">\n<meta property=\"og:image\" content=\"assets/og-partage.png\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"En 2027, ne demandez pas le programme. Faites-le !\">\n<meta name=\"twitter:description\" content=\"Pour la première fois dans une élection présidentielle : la société civile dépose ses solutions, les citoyens votent pour celles qui comptent, les candidats répondent. Les priorités d'abord, le candidat ensuite.\">\n<meta name=\"twitter:image\" content=\"assets/og-partage.png\">\n<style>\n@font-face { font-family: 'Archivo'; src: url(\"158b4670-5ab2-416b-a1e6-f0253914c6e6\") format('woff2'); font-weight: 100 900; font-display: swap; }\n@font-face { font-family: 'DM Sans'; src: url(\"170c7a9c-0cd8-45ea-a707-127cbae07142\") format('woff2'); font-weight: 100 1000; font-display: swap; }\nbody { margin: 0; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; color: #35485C; -webkit-font-smoothing: antialiased; }\nh1, h2, h3 { font-family: 'Archivo', system-ui, sans-serif; margin: 0; }\np { margin: 0; }\na { color: #005E66; text-underline-offset: 3px; }\na:hover { color: #102A43; }\n:focus-visible { outline: 3px solid #F9E071; outline-offset: 3px; }\n@media (max-width: 900px) {\n  header > div, section > div, footer > div, #logo-band > div { padding-left: 22px !important; padding-right: 22px !important; }\n  header nav { flex-wrap: wrap; gap: 14px 18px !important; }\n  h1 { font-size: 40px !important; }\n  section h2 { font-size: 27px !important; }\n  [data-m=\"panel\"] { padding: 26px 22px 30px !important; }\n  [data-m=\"stack\"] { grid-template-columns: 1fr !important; gap: 28px !important; }\n  [data-m=\"stack\"] > div:not([style*=\"background\"]) { padding-left: 0 !important; padding-right: 0 !important; }\n  [data-m=\"tabs\"] { grid-template-columns: 1fr 1fr !important; gap: 24px 16px !important; }\n  [data-m=\"tabs\"] button { padding-right: 0 !important; }\n  [data-m=\"stats\"] { grid-template-columns: 1fr !important; }\n  [data-m=\"stats\"] > div { padding: 16px 0 18px !important; border-bottom: 1px solid #E2E7EB; }\n  [data-m=\"col\"] { padding-left: 0 !important; padding-right: 0 !important; }\n  [data-m=\"stats\"] > div > p:first-child { min-height: 0 !important; }\n  [data-m=\"num\"] { font-size: 46px !important; }\n}\n@media (max-width: 560px) {\n  h1 { font-size: 32px !important; }\n  [data-m=\"tabs\"] { grid-template-columns: 1fr !important; }\n}\n@keyframes logo-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n#logo-track { animation: logo-marquee 34s linear infinite; }\n#logo-band:hover #logo-track, #logo-band:focus-within #logo-track { animation-play-state: paused; }\n@media (prefers-reduced-motion: reduce) { #logo-track { animation: none; } }\n</style>\n<script src=\"c5345272-12e8-4319-bea1-790719c94e09\"><\u002Fscript>\n</helmet>\n\n<div>\n\n<a href=\"#principe\" style=\"position: absolute; left: -9999px; top: 0; background: #F9E071; color: #102A43; font-family: 'Archivo', sans-serif; font-weight: 700; padding: 14px 20px; z-index: 50\" style-focus=\"left: 12px; top: 12px\">Aller au contenu</a>\n\n<header style=\"background: #102A43; color: #FFFFFF\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 0 40px\">\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.14)\">\n      <img src=\"f8783fa9-2432-4529-a8b0-f25444e75c72\" alt=\"La Présidentielle Inversée\" style=\"height: 28px; display: block\">\n      <nav aria-label=\"Sections\" style=\"display: flex; gap: 26px; font-size: 14px\">\n        <a href=\"#principe\" style=\"color: rgba(255,255,255,0.78); text-decoration: none\" style-hover=\"color: #F9E071\">Le principe</a>\n        <a href=\"#collectif\" style=\"color: rgba(255,255,255,0.78); text-decoration: none\" style-hover=\"color: #F9E071\">Le collectif</a>\n        <a href=\"#garanties\" style=\"color: rgba(255,255,255,0.78); text-decoration: none\" style-hover=\"color: #F9E071\">Les garanties</a>\n        <a href=\"#contacts\" style=\"color: #F9E071; text-decoration: none\" style-hover=\"color: #FFFFFF\">Contacts</a>\n      </nav>\n    </div>\n\n    <div style=\"padding: 66px 0 78px\">\n      <p style=\"font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #F9E071\">Présidentielle 2027</p>\n      <h1 style=\"font-weight: 900; font-size: 72px; line-height: 1.0; letter-spacing: -0.04em; margin: 24px 0 0; max-width: 20ch; text-wrap: balance\">En 2027, ne demandez pas le programme. Faites-le<span style=\"color: #FBB1D7\"> !</span></h1>\n      <p style=\"font-size: 23px; line-height: 1.5; color: rgba(255,255,255,0.88); max-width: 54ch; margin-top: 28px\">Pour la première fois dans une élection présidentielle, les acteurs de la société civile proposent leurs solutions, les citoyens votent pour celles qu'ils veulent prioriser et les candidats se positionnent.</p>\n      <div style=\"display: flex; gap: 14px; flex-wrap: wrap; margin-top: 34px\">\n        <a href=\"#inscription-citoyens\" style=\"font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 16px; padding: 16px 24px; background: #FBB1D7; color: #102A43; text-decoration: none\" style-hover=\"background: #FFFFFF\">Me prévenir du vote</a>\n      </div>\n      <p style=\"font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.62); margin-top: 22px\">Vous représentez une association, un syndicat, une entreprise ? <a href=\"#inscription-organisations\" style=\"color: #F9E071; text-decoration: underline; text-underline-offset: 3px\" style-hover=\"color: #FFFFFF\">Déposez vos propositions</a></p>\n    </div>\n\n  </div>\n</header>\n\n<section id=\"principe\" style=\"background: #F7F4EC; border-bottom: 1px solid #E2E7EB\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 72px 40px 84px\">\n    <h2 style=\"font-weight: 900; font-size: 40px; letter-spacing: -0.035em; color: #102A43\">Comment fonctionne La Présidentielle Inversée ?</h2>\n    <p style=\"font-size: 20px; line-height: 1.5; color: #46586B; margin-top: 14px; max-width: 62ch\">4 étapes, du dépôt des solutions au suivi des engagements, de septembre 2026 à la fin du quinquennat</p>\n\n    <div data-m=\"tabs\" role=\"tablist\" aria-label=\"Les quatre étapes\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 44px; align-items: start\">\n      <button type=\"button\" sc-camel-on-click=\"{{ go1 }}\" aria-current=\"{{ cur1 }}\" style=\"text-align: left; background: transparent; border: 0; padding: 0; align-self: start; cursor: pointer; font-family: 'DM Sans', sans-serif; display: block; width: 100%\">\n        <div style=\"height: 14px; background: #F9E071; opacity: {{ op1 }}\"></div>\n        <div style=\"height: 3px; background: #102A43; opacity: {{ act1 }}\"></div>\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-top: 18px\">\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 52px; line-height: 0.85; letter-spacing: -0.05em; color: #102A43; opacity: {{ tx1 }}\">01</span>\n        </div>\n        <h3 style=\"font-weight: 900; font-size: 21px; line-height: 1.15; letter-spacing: -0.025em; color: #102A43; margin-top: 14px; opacity: {{ tx1 }}\">La société civile propose</h3>\n        <p style=\"font-size: 15px; line-height: 1.5; color: #46586B; margin-top: 8px; opacity: {{ tx1 }}\">Sept. → déc. 2026</p>\n      </button>\n      <button type=\"button\" sc-camel-on-click=\"{{ go2 }}\" aria-current=\"{{ cur2 }}\" style=\"text-align: left; background: transparent; border: 0; padding: 0; align-self: start; cursor: pointer; font-family: 'DM Sans', sans-serif; display: block; width: 100%\">\n        <div style=\"height: 14px; background: #FBB1D7; opacity: {{ op2 }}\"></div>\n        <div style=\"height: 3px; background: #102A43; opacity: {{ act2 }}\"></div>\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-top: 18px\">\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 52px; line-height: 0.85; letter-spacing: -0.05em; color: #102A43; opacity: {{ tx2 }}\">02</span>\n        </div>\n        <h3 style=\"font-weight: 900; font-size: 21px; line-height: 1.15; letter-spacing: -0.025em; color: #102A43; margin-top: 14px; opacity: {{ tx2 }}\">Les citoyens priorisent</h3>\n        <p style=\"font-size: 15px; line-height: 1.5; color: #46586B; margin-top: 8px; opacity: {{ tx2 }}\">Déc. 2026 → févr. 2027</p>\n      </button>\n      <button type=\"button\" sc-camel-on-click=\"{{ go3 }}\" aria-current=\"{{ cur3 }}\" style=\"text-align: left; background: transparent; border: 0; padding: 0; align-self: start; cursor: pointer; font-family: 'DM Sans', sans-serif; display: block; width: 100%\">\n        <div style=\"height: 14px; background: #0A7A62; opacity: {{ op3 }}\"></div>\n        <div style=\"height: 3px; background: #102A43; opacity: {{ act3 }}\"></div>\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-top: 18px\">\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 52px; line-height: 0.85; letter-spacing: -0.05em; color: #102A43; opacity: {{ tx3 }}\">03</span>\n        </div>\n        <h3 style=\"font-weight: 900; font-size: 21px; line-height: 1.15; letter-spacing: -0.025em; color: #102A43; margin-top: 14px; opacity: {{ tx3 }}\">Les candidats s'engagent</h3>\n        <p style=\"font-size: 15px; line-height: 1.5; color: #46586B; margin-top: 8px; opacity: {{ tx3 }}\">Mars → avr. 2027</p>\n      </button>\n      <button type=\"button\" sc-camel-on-click=\"{{ go4 }}\" aria-current=\"{{ cur4 }}\" style=\"text-align: left; background: transparent; border: 0; padding: 0; align-self: start; cursor: pointer; font-family: 'DM Sans', sans-serif; display: block; width: 100%\">\n        <div style=\"height: 14px; background: #005E66; opacity: {{ op4 }}\"></div>\n        <div style=\"height: 3px; background: #102A43; opacity: {{ act4 }}\"></div>\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-top: 18px\">\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 52px; line-height: 0.85; letter-spacing: -0.05em; color: #102A43; opacity: {{ tx4 }}\">04</span>\n        </div>\n        <h3 style=\"font-weight: 900; font-size: 21px; line-height: 1.15; letter-spacing: -0.025em; color: #102A43; margin-top: 14px; opacity: {{ tx4 }}\">Les engagements sont suivis</h3>\n        <p style=\"font-size: 15px; line-height: 1.5; color: #46586B; margin-top: 8px; opacity: {{ tx4 }}\">2027 → 2032</p>\n      </button>\n    </div>\n\n    <div data-m=\"panel\" style=\"background: #FFFFFF; border: 1px solid #E2E7EB; margin-top: 40px; padding: 0 48px 46px\">\n\n      <sc-if value=\"{{ step1 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"height: 8px; background: #F9E071\"></div>\n        <div style=\"margin-top: 26px\">\n          <h2 style=\"font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.035em; color: #102A43\">La société civile propose</h2>\n        </div>\n        <div style=\"margin-top: 24px\">\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 27px; line-height: 1.25; letter-spacing: -0.03em; color: #102A43; max-width: 24ch\">La plus grande base de solutions jamais réunie en France.</p>\n          <p style=\"font-size: 18px; line-height: 1.6; margin-top: 18px; max-width: 62ch\">Pouvoir d'achat, santé, école, travail, logement, sécurité, environnement, libertés… sur tous les sujets qui préoccupent les Françaises et les Français, les solutions existent déjà. Elles viennent de milliers d'entreprises, d'associations, de syndicats et de fondations. Éprouvées sur le terrain, elles n'attendent qu'une chose : être soutenues par des millions de citoyens.</p>\n          <div style=\"margin-top: 30px\">\n            <a href=\"#inscription-organisations\" style=\"display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 16px; padding: 15px 24px; background: #F9E071; color: #102A43; text-decoration: none\" style-hover=\"background: #FFFFFF\">Inscrire mon organisation</a>\n          </div>\n                  </div>\n      </div>\n      </sc-if>\n\n      <sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"height: 8px; background: #FBB1D7\"></div>\n        <div style=\"margin-top: 26px\">\n          <h2 style=\"font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.035em; color: #102A43\">Les citoyens priorisent</h2>\n        </div>\n        <div style=\"margin-top: 24px\">\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 27px; line-height: 1.25; letter-spacing: -0.03em; color: #102A43; max-width: 24ch\">Avant de choisir un candidat ou une candidate, choisissez ce qui compte pour vous.</p>\n          <p style=\"font-size: 18px; line-height: 1.6; margin-top: 18px; max-width: 62ch\">Il suffit de quelques minutes pour évaluer une série de propositions. Un peu, beaucoup, passionnément, durant les 2 mois de la phase de vote, vous vous impliquez&nbsp;à votre rythme pour évaluer, prioriser et partager vos propositions préférées.</p>\n          <div style=\"margin-top: 30px\">\n            <a href=\"#inscription-citoyens\" style=\"display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 16px; padding: 15px 24px; background: #FBB1D7; color: #102A43; text-decoration: none\" style-hover=\"background: #102A43; color: #FFFFFF\">Me prévenir du vote</a>\n          </div>\n        </div>\n      </div>\n      </sc-if>\n\n      <sc-if value=\"{{ step3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"height: 8px; background: #0A7A62\"></div>\n        <div style=\"margin-top: 26px\">\n          <h2 style=\"font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.035em; color: #102A43\">Les candidats s'engagent</h2>\n        </div>\n        <div style=\"margin-top: 24px\">\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 27px; line-height: 1.25; letter-spacing: -0.03em; color: #102A43; max-width: 24ch\"><span style=\"letter-spacing: -0.03em;\">Nous les aidons à identifier les solutions provenant du terrain qui ont la faveur des électeurs. A eux de s'en saisir.&nbsp;</span></p>\n          <p style=\"font-size: 18px; line-height: 1.6; margin-top: 18px; max-width: 62ch\">Une fois le vote des citoyens terminé, les candidats et les candidates découvrent le classement des propositions dans chaque thème et sont invités à se positionner et à venir débattre sur leurs choix.</p>\n          <div data-m=\"stack\" style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #E2E7EB; margin-top: 32px\">\n            <div data-m=\"col\" style=\"background: #FFFFFF; padding: 24px 28px 26px 0\">\n              <h3 style=\"font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #102A43\">Une prise de position mesure par mesure</h3>\n              <p style=\"font-size: 16px; line-height: 1.6; margin-top: 10px\">Chaque candidat indique les solutions qu'il s'engage à mettre en oeuvre s'il est élu. Les réponses restent publiées et comparables jusqu'au scrutin.</p>\n            </div>\n            <div data-m=\"col\" style=\"background: #FFFFFF; padding: 24px 0 26px 28px\">\n              <h3 style=\"font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #102A43\">Des débats ouverts, au même format pour tous</h3>\n              <p style=\"font-size: 16px; line-height: 1.6; margin-top: 10px\">Face aux organisations et à des citoyens tirés au sort, chaque candidat dit ce qu'il retient, pourquoi il écarte le reste, et ce qu'il propose à la place.</p>\n            </div>\n          </div>\n        </div>\n      </div>\n      </sc-if>\n\n      <sc-if value=\"{{ step4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"height: 8px; background: #005E66\"></div>\n        <div style=\"margin-top: 26px\">\n          <h2 style=\"font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.035em; color: #102A43\">Les engagements sont suivis</h2>\n        </div>\n        <div style=\"margin-top: 24px\">\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 27px; line-height: 1.25; letter-spacing: -0.03em; color: #102A43; max-width: 24ch\">L'élection passe. Les engagements restent.</p>\n          <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 34px\">\n            <div style=\"background: #005E66; height: 10px\"></div>\n            <div style=\"background: #005E66; height: 10px\"></div>\n            <div style=\"background: #005E66; height: 10px\"></div>\n            <div style=\"background: #005E66; height: 10px\"></div>\n            <div style=\"background: #005E66; height: 10px\"></div>\n          </div>\n          <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px\">\n            <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px; color: #46586B\">2027</p>\n            <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px; color: #46586B\">2028</p>\n            <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px; color: #46586B\">2029</p>\n            <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px; color: #46586B\">2030</p>\n            <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px; color: #46586B\">2031</p>\n          </div>\n          <p style=\"font-size: 17px; line-height: 1.6; margin-top: 24px; max-width: 62ch\">Des rendez-vous publics réguliers, dans les médias, pendant cinq ans : ce qui a été engagé, ce qui a été fait, ce qui ne l'a pas été. Le collectif La Politique inversée suit la mise en œuvre avec le Président ou la Présidente, sans relâche.</p>\n        </div>\n      </div>\n      </sc-if>\n\n      <div style=\"border-top: 1px solid #E2E7EB; margin-top: 44px; padding-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n        <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goPrev }}\" style=\"display: flex; align-items: center; gap: 12px; background: transparent; border: 0; padding: 8px 0; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: left; color: #46586B\" style-hover=\"color: #102A43\">\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 22px; line-height: 1; color: #005E66\">←</span>\n          <span style=\"display: block\">\n            <span style=\"display: block; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #46586B\">Étape précédente</span>\n            <span style=\"display: block; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; color: #102A43; margin-top: 3px\">{{ prevLabel }}</span>\n          </span>\n        </button>\n        </sc-if>\n        <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goNext }}\" style=\"display: flex; align-items: center; gap: 12px; background: transparent; border: 0; padding: 8px 0; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: right; color: #46586B; margin-left: auto\" style-hover=\"color: #102A43\">\n          <span style=\"display: block\">\n            <span style=\"display: block; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #46586B\">Étape suivante</span>\n            <span style=\"display: block; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; color: #102A43; margin-top: 3px\">{{ nextLabel }}</span>\n          </span>\n          <span style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 22px; line-height: 1; color: #005E66\">→</span>\n        </button>\n        </sc-if>\n      </div>\n\n    </div>\n  </div>\n</section>\n\n<section id=\"collectif\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 76px 40px 0\">\n    <div data-m=\"stack\" style=\"display: grid; grid-template-columns: 1.05fr 1fr; gap: 64px; align-items: start\">\n      <h2 style=\"font-weight: 900; font-size: 44px; line-height: 1.04; letter-spacing: -0.04em; color: #102A43; max-width: 18ch\"><span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 86px; letter-spacing: -0.055em; line-height: 0.9; margin-right: 4px;\">20</span> ans d'engagement au service de l'intérêt général</h2>\n      <p style=\"font-size: 18px; line-height: 1.6; max-width: 56ch; padding-top: 6px\">Nos trois organisations facilitent la prise de parole et la coopération entre les acteurs de la société civile : dispositifs de concertation, campagnes d'intérêt général, démarches de plaidoyer, etc. Nous avons appris ce qu'il faut faire pour écouter et prendre en compte la diversité des opinions. Nous nous engageons aujourd'hui pour remettre la démocratie à l'endroit.</p>\n    </div>\n\n    <div data-m=\"stack\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 52px; padding-bottom: 60px\">\n      <div style=\"border-top: 2px solid #102A43; padding-top: 22px; display: flex; flex-direction: column\">\n        <div style=\"height: 60px; display: flex; align-items: center\"><a href=\"https://www.cap-collectif.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Cap Collectif\" style=\"display: block\"><div style=\"width: 148px; height: 60px\"><image-slot id=\"col-cap\" style=\"--image-slot-bg: transparent\" shape=\"rect\" fit=\"contain\" placeholder=\"Cap Collectif\" src=\"d84558e0-271e-4220-8e2f-715e704d2891\"></image-slot></div></a></div>\n        <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.25; letter-spacing: -0.02em; color: #102A43; margin-top: 22px\">Met à disposition la plateforme</p>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #46586B; margin-top: 10px\">Entreprise française pionnière du numérique citoyen, conceptrice de la plateforme de consultation open source la plus utilisée en France par les ministères, collectivités, associations et entreprises.</p>\n      </div>\n      <div style=\"border-top: 2px solid #102A43; padding-top: 22px; display: flex; flex-direction: column\">\n        <div style=\"height: 60px; display: flex; align-items: center\"><a href=\"https://lagencerup.fr/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"L'agence RUP\" style=\"display: block\"><div style=\"width: 148px; height: 60px\"><image-slot id=\"col-rup\" style=\"--image-slot-bg: transparent\" shape=\"rect\" fit=\"contain\" placeholder=\"L'agence RUP\" src=\"163670d9-198e-4bc7-9a77-c8f7834f2385\"></image-slot></div></a></div>\n        <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.25; letter-spacing: -0.02em; color: #102A43; margin-top: 22px\">Mobilise la société civile</p>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #46586B; margin-top: 10px\">Agence coopérative de communication au service des associations, des fondations, des acteurs publics et des entreprises à impact. Plus de 300 organisations accompagnées à ce jour.</p>\n      </div>\n      <div style=\"border-top: 2px solid #102A43; padding-top: 22px; display: flex; flex-direction: column\">\n        <div style=\"height: 60px; display: flex; align-items: center\"><a href=\"https://empreintes-citoyennes.fr/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Empreintes Citoyennes\" style=\"display: block\"><div style=\"width: 148px; height: 60px\"><image-slot id=\"col-emp\" style=\"--image-slot-bg: transparent\" shape=\"rect\" fit=\"contain\" placeholder=\"Empreintes Citoyennes\" src=\"a4d09315-3604-4b7a-a2c5-c1d5184ab2b6\"></image-slot></div></a></div>\n        <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.25; letter-spacing: -0.02em; color: #102A43; margin-top: 22px\">Ancre le projet localement</p>\n        <p style=\"font-size: 16px; line-height: 1.55; color: #46586B; margin-top: 10px\">Association reconnue d'intérêt général qui délivre le label Villes et Villages Citoyen(ne)s, 850 communes candidates.</p>\n      </div>\n    </div>\n  </div>\n\n  <div style=\"background: #F6F7F8; border-top: 1px solid #E2E7EB; border-bottom: 1px solid #E2E7EB\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 52px 40px 56px\">\n      <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 27px; line-height: 1.25; letter-spacing: -0.03em; color: #102A43; max-width: 30ch\">Douze ans que la France des villes et des campagnes s'exprime sur la plateforme de Cap Collectif</p>\n      <div data-m=\"stack\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 36px; border-top: 1px solid #D8DFE5; padding-top: 28px\">\n        <div>\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -0.045em; color: #102A43\">600</p>\n          <p style=\"font-size: 16px; line-height: 1.45; color: #46586B; margin-top: 10px\">organisations utilisatrices, de toute taille et de tout type</p>\n        </div>\n        <div>\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -0.045em; color: #102A43\">1 500</p>\n          <p style=\"font-size: 16px; line-height: 1.45; color: #46586B; margin-top: 10px\">projets menés (enquêtes publiques, débats, budgets participatifs, consultations et concertations citoyennes...)</p>\n        </div>\n        <div>\n          <p style=\"font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -0.045em; color: #102A43\">3 millions</p>\n          <p style=\"font-size: 16px; line-height: 1.45; color: #46586B; margin-top: 10px\">de citoyens mobilisés</p>\n        </div>\n      </div>\n      <p style=\"font-size: 17px; line-height: 1.6; color: #46586B; margin-top: 30px; border-top: 1px solid #D8DFE5; padding-top: 26px; max-width: 78ch\">Les plus grandes consultations nationales de la décennie s'y sont tenues : loi Égalim, loi pour une République numérique, retraites, bioéthique, égalité et citoyenneté... Et le Grand Débat national, 1,5 million de participants : à ce jour la plus grande consultation jamais organisée par l'État français.</p>\n    </div>\n  </div>\n</section>\n\n<sc-if value=\"{{ logos }}\" hint-placeholder-val=\"{{ true }}\">\n<section style=\"background: #F7F4EC; border-top: 1px solid #E2E7EB; border-bottom: 1px solid #E2E7EB\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 66px 40px 72px\">\n    <h2 style=\"font-weight: 900; font-size: 36px; line-height: 1.05; letter-spacing: -0.035em; color: #102A43; max-width: 26ch\">Les amis de la Présidentielle Inversée</h2>\n    <p style=\"font-size: 18px; line-height: 1.6; color: #46586B; margin-top: 16px; max-width: 62ch\">Des médias et des personnalités qui s'engagent pour faire connaître la démarche et la porter le plus loin possible. Ils ne participent ni au dépôt des propositions, ni à la modération.</p>\n\n    <div style=\"border-top: 1px solid #DCD6C6; margin-top: 40px; padding-top: 28px\">\n      <div style=\"display: flex; align-items: center; gap: 24px; flex-wrap: wrap\">\n        <div style=\"background: #FFFFFF; border: 1px solid #DCD6C6; width: 220px; height: 100px; display: flex; align-items: center; justify-content: center; padding: 14px 20px; box-sizing: border-box; flex: 0 0 auto\">\n          <image-slot id=\"media-inrocks\" style=\"--image-slot-bg: #FFFFFF\" shape=\"rect\" fit=\"contain\" placeholder=\"Les Inrockuptibles\" src=\"7894bf62-b02b-48df-ba21-c9b80a03bcf7\"></image-slot>\n        </div>\n        <div style=\"background: #FFFFFF; border: 1px solid #DCD6C6; width: 220px; height: 100px; display: flex; align-items: center; justify-content: center; padding: 14px 20px; box-sizing: border-box; flex: 0 0 auto\">\n          <image-slot id=\"media-nova\" style=\"--image-slot-bg: #FFFFFF\" shape=\"rect\" fit=\"contain\" placeholder=\"Radio Nova\" src=\"deeb2bc1-7c2d-4f7d-818c-24ce5370119c\"></image-slot>\n        </div>\n      </div>\n    </div>\n\n    <div style=\"border-top: 1px solid #DCD6C6; margin-top: 34px; padding-top: 28px\">\n      <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #102A43\">Comité de soutien</p>\n      <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.3; letter-spacing: -0.025em; color: #102A43; margin-top: 14px\">Présidé par Bertrand Pancher</p>\n      <p style=\"font-size: 16px; line-height: 1.55; color: #46586B; margin-top: 8px; max-width: 62ch\">Ancien député, fondateur de l'association Décider ensemble.</p>\n    </div>\n  </div>\n</section>\n</sc-if>\n\n<section id=\"garanties\" style=\"background: #FFFFFF; border-bottom: 1px solid #E2E7EB\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 76px 40px 82px\">\n    <h2 style=\"font-weight: 900; font-size: 40px; line-height: 1.05; letter-spacing: -0.035em; color: #102A43; max-width: 26ch\">Une initiative citoyenne qui ne roule pour personne.</h2>\n    <p style=\"font-size: 18px; line-height: 1.6; color: #46586B; margin-top: 16px; max-width: 62ch\">La Présidentielle inversée est un dispositif sans jugement ni parti pris. Il ne produit aucun contenu et n'arbitre aucun désaccord.</p>\n    <div data-m=\"stack\" style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px 56px; margin-top: 42px\">\n      <div style=\"border-top: 2px solid #102A43; padding-top: 18px\">\n        <h3 style=\"font-weight: 800; font-size: 21px; letter-spacing: -0.02em; color: #102A43\">Zéro censure</h3>\n        <p style=\"font-size: 16px; line-height: 1.6; margin-top: 10px\">Association, syndicat, coopérative, entreprise, fondation : peu importe le statut, peu importe l'opinion. Une seule exigence, la même pour tous : servir l'intérêt général, sans dénigrer aucune catégorie de la population.</p>\n      </div>\n      <div style=\"border-top: 2px solid #102A43; padding-top: 18px\">\n        <h3 style=\"font-weight: 800; font-size: 21px; letter-spacing: -0.02em; color: #102A43\">Ce n'est pas un sondage</h3>\n        <p style=\"font-size: 16px; line-height: 1.6; margin-top: 10px\">Notre sujet n'est pas de savoir si les gens qui participent sur la plateforme sont représentatifs de la population française. Notre intention est de donner à chacun la possibilité de donner de la voix à ce qui compte pour lui ou elle.</p>\n      </div>\n      <div style=\"border-top: 2px solid #102A43; padding-top: 18px\">\n        <h3 style=\"font-weight: 800; font-size: 21px; letter-spacing: -0.02em; color: #102A43\">Tous les candidats, traités à égalité</h3>\n        <p style=\"font-size: 16px; line-height: 1.6; margin-top: 10px\">Toutes et tous sont invités, avec le même format, le même temps de parole, les mêmes questions. Les seuls absents seront ceux qui auront choisi de ne pas venir. La liste sera publique.</p>\n      </div>\n      <div style=\"border-top: 2px solid #102A43; padding-top: 18px\">\n        <h3 style=\"font-weight: 800; font-size: 21px; letter-spacing: -0.02em; color: #102A43\">Tout appartient à tout le monde</h3>\n        <p style=\"font-size: 16px; line-height: 1.6; margin-top: 10px\">Les propositions publiées, les votes et les réponses des candidats seront disponibles en open data. Chacun pourra les reprendre, les analyser, les prolonger dès lors que c'est au service du bien commun.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section id=\"contacts\" style=\"background: #102A43; color: #FFFFFF\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 84px 40px 90px\">\n    <h2 style=\"font-weight: 900; font-size: 44px; line-height: 1.04; letter-spacing: -0.04em; max-width: 20ch\">Avec la Présidentielle Inversée, 2027 commence maintenant.</h2>\n    <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15; letter-spacing: -0.03em; color: #F9E071; margin-top: 16px; max-width: 26ch\">A vous de jouer !</p>\n\n    <div data-m=\"stack\" style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; margin-top: 60px\">\n      <div id=\"inscription-organisations\" style=\"background: #FFFFFF; color: #102A43; border-top: 6px solid #F9E071; padding: 32px 32px 34px\">\n        <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #46586B\">Organisations</p>\n        <h3 style=\"font-weight: 900; font-size: 26px; line-height: 1.15; letter-spacing: -0.03em; margin-top: 12px\">Engager mon organisation</h3>\n        <p style=\"font-size: 16px; line-height: 1.55; margin-top: 12px\">Laissez-nous vos coordonnées : nous vous expliquons comment déposer vos propositions, et quand.</p>\n        <form name=\"inscription-organisations\" method=\"POST\" action=\"/\" data-netlify=\"true\" data-netlify-honeypot=\"bot-field-organisations\" data-netlify-form=\"true\" data-success-message=\"Merci, votre organisation est bien inscrite.\" style=\"margin-top: 22px\">\n          <input type=\"hidden\" name=\"form-name\" value=\"inscription-organisations\">\n          <input type=\"hidden\" name=\"origine\" value=\"contacts-organisations\">\n          <p style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap\">\n            <label>Ne remplissez pas ce champ : <input name=\"bot-field-organisations\" type=\"text\" tabindex=\"-1\" autocomplete=\"off\"></label>\n          </p>\n          <label for=\"o-nom\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Nom de l'organisation</label>\n          <label for=\"o-personne\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Nom complet</label>\n          <label for=\"o-fonction\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Fonction</label>\n          <label for=\"o-email\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Adresse email</label>\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <input id=\"o-nom\" name=\"organisation\" type=\"text\" required=\"required\" placeholder=\"Nom de votre organisation\" style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 14px 16px; border: 1px solid #C9D3DB; background: #FFFFFF; color: #102A43; border-radius: 0\">\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n              <input id=\"o-personne\" name=\"nom\" type=\"text\" required=\"required\" placeholder=\"Nom complet\" style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 14px 16px; border: 1px solid #C9D3DB; background: #FFFFFF; color: #102A43; border-radius: 0; flex: 1 1 150px; min-width: 0\">\n              <input id=\"o-fonction\" name=\"fonction\" type=\"text\" required=\"required\" placeholder=\"Fonction\" style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 14px 16px; border: 1px solid #C9D3DB; background: #FFFFFF; color: #102A43; border-radius: 0; flex: 1 1 150px; min-width: 0\">\n            </div>\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n              <input id=\"o-email\" name=\"email\" type=\"email\" required=\"required\" placeholder=\"email@exemple.fr\" style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 14px 16px; border: 1px solid #C9D3DB; background: #FFFFFF; color: #102A43; border-radius: 0; flex: 1 1 190px; min-width: 0\">\n              <button type=\"submit\" style=\"font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; padding: 15px 22px; border: 0; background: #F9E071; color: #102A43; border-radius: 0; cursor: pointer; flex: 0 0 auto\" style-hover=\"background: #102A43; color: #FFFFFF\">Je m'inscris</button>\n            </div>\n          </div>\n        \n          <p data-form-status=\"true\" role=\"status\" aria-live=\"polite\" hidden=\"hidden\" style=\"font-size: 14px; line-height: 1.45; margin-top: 12px\"></p>\n        </form>\n      </div>\n\n      <div id=\"inscription-citoyens\" style=\"background: rgba(255,255,255,0.06); border-top: 6px solid #FBB1D7; padding: 32px 32px 34px\">\n        <p style=\"font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55)\">Citoyens</p>\n        <h3 style=\"font-weight: 900; font-size: 26px; line-height: 1.15; letter-spacing: -0.03em; color: #FFFFFF; margin-top: 12px\">Suivre le projet et voter en 2027</h3>\n        <p style=\"font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.82); margin-top: 12px\">Les avancées du projet, puis un message le jour où le vote ouvre. Rien de plus.</p>\n        <form name=\"inscription-citoyens\" method=\"POST\" action=\"/\" data-netlify=\"true\" data-netlify-honeypot=\"bot-field-citoyens\" data-netlify-form=\"true\" data-success-message=\"Merci, votre inscription est bien enregistrée.\" style=\"margin-top: 22px\">\n          <input type=\"hidden\" name=\"form-name\" value=\"inscription-citoyens\">\n          <input type=\"hidden\" name=\"origine\" value=\"contacts-citoyens\">\n          <p style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap\">\n            <label>Ne remplissez pas ce champ : <input name=\"bot-field-citoyens\" type=\"text\" tabindex=\"-1\" autocomplete=\"off\"></label>\n          </p>\n          <label for=\"c-email\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Adresse email</label>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n            <input id=\"c-email\" name=\"email\" type=\"email\" required=\"required\" placeholder=\"email@exemple.fr\" style=\"font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.32); background: rgba(255,255,255,0.06); color: #FFFFFF; border-radius: 0; flex: 1 1 190px; min-width: 0\">\n            <button type=\"submit\" style=\"font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; padding: 15px 22px; border: 0; background: #FBB1D7; color: #102A43; border-radius: 0; cursor: pointer; flex: 0 0 auto\" style-hover=\"background: #FFFFFF\">Je m'inscris</button>\n          </div>\n        \n          <p data-form-status=\"true\" role=\"status\" aria-live=\"polite\" hidden=\"hidden\" style=\"font-size: 14px; line-height: 1.45; margin-top: 12px\"></p>\n        </form>\n      </div>\n    </div>\n\n    <p style=\"font-size: 17px; line-height: 1.55; color: rgba(255,255,255,0.82); margin-top: 28px\">Pour toute question ou proposition de partenariat, <a href=\"mailto:contact@lapresidentielleinversee.fr\" style=\"color: #F9E071; text-decoration: underline; text-underline-offset: 3px\" style-hover=\"color: #FFFFFF\">écrivez-nous</a>.</p>\n\n  </div>\n</section>\n\n<footer style=\"background: #0B1F33; color: rgba(255,255,255,0.7)\">\n  <div style=\"max-width: 1120px; margin: 0 auto; padding: 44px 40px; display: flex; align-items: center; justify-content: space-between; gap: 40px; flex-wrap: wrap\">\n    <div style=\"display: flex; align-items: center; gap: 28px; flex-wrap: wrap\">\n      <img src=\"f8783fa9-2432-4529-a8b0-f25444e75c72\" alt=\"La Présidentielle Inversée\" style=\"height: 24px; display: block\">\n      <p style=\"font-size: 14px; line-height: 1.5; max-width: 46ch\">Un projet du collectif « Politique inversée » : Cap Collectif, l'agence RUP et Empreintes Citoyennes. Démarche indépendante des partis politiques.</p>\n    </div>\n  </div>\n</footer>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;comparatifMobilisations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;bandeauxLogos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenu&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._t = setInterval(() => this._mirror(), 1200);\n  }\n  componentWillUnmount() {\n    clearInterval(this._t);\n  }\n  _mirror() {\n    const track = document.getElementById('logo-track');\n    const groupA = track && track.querySelector('[data-group=\"a\"]');\n    if (!groupA) return;\n    const slots = [...groupA.querySelectorAll('image-slot')];\n    const srcs = slots.map(sl => {\n      const im = sl.shadowRoot && sl.shadowRoot.querySelector('img');\n      return im && im.getAttribute('src') ? im.src : '';\n    });\n    const key = srcs.join('|');\n    if (key === this._key) return;\n    this._key = key;\n    const old = track.querySelector('[data-group=\"b\"]');\n    if (old) old.remove();\n    if (!srcs.some(Boolean)) return;\n    const b = document.createElement('div');\n    b.dataset.group = 'b';\n    b.setAttribute('aria-hidden', 'true');\n    b.style.display = 'flex';\n    srcs.forEach(src => {\n      const card = document.createElement('div');\n      card.style.cssText = 'background:#FFFFFF;height:96px;width:199px;margin-right:16px;display:flex;align-items:center;justify-content:center;padding:12px 16px;box-sizing:border-box;overflow:hidden;flex:0 0 auto';\n      if (src) {\n        const img = document.createElement('img');\n        img.src = src;\n        img.alt = '';\n        img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';\n        card.appendChild(img);\n      }\n      b.appendChild(card);\n    });\n    track.appendChild(b);\n  }\n  state = { step: 1 };\n  renderVals() {\n    const st = this.state.step;\n    const v = {\n      comparatif: this.props.comparatifMobilisations ?? true,\n      logos: this.props.bandeauxLogos ?? true\n    };\n    for (let i = 1; i <= 4; i++) {\n      v['step' + i] = st === i;\n      v['cur' + i] = st === i ? 'true' : 'false';\n      v['op' + i] = st === i ? 1 : 0.3;\n      v['tx' + i] = 1;\n      v['act' + i] = st === i ? 1 : 0;\n      v['go' + i] = () => this.setState({ step: i });\n    }\n    const labels = ['La société civile propose', 'Les citoyens priorisent', \"Les candidats s'engagent\", 'Les engagements sont suivis'];\n    v.hasPrev = st > 1;\n    v.hasNext = st < 4;\n    v.prevLabel = labels[st - 2] || '';\n    v.nextLabel = labels[st] || '';\n    v.goPrev = () => this.setState(s2 => ({ step: Math.max(1, s2.step - 1) }));\n    v.goNext = () => this.setState(s2 => ({ step: Math.min(4, s2.step + 1) }));\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<script>\n(() => {\n  const errorMessage = \"L'envoi a échoué. Réessayez ou écrivez-nous à contact@lapresidentielleinversee.fr.\";\n\n  document.addEventListener('submit', async event => {\n    const form = event.target.closest?.('form[data-netlify-form=\"true\"]');\n    if (!form) return;\n\n    event.preventDefault();\n    const button = form.querySelector('button[type=\"submit\"]');\n    const status = form.querySelector('[data-form-status=\"true\"]');\n    const buttonLabel = button.textContent;\n\n    form.setAttribute('aria-busy', 'true');\n    button.disabled = true;\n    button.textContent = 'Envoi en cours…';\n    status.hidden = false;\n    status.textContent = 'Envoi en cours…';\n\n    try {\n      const response = await fetch(form.action, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n        body: new URLSearchParams(new FormData(form)).toString()\n      });\n      if (!response.ok) throw new Error(`HTTP ${response.status}`);\n      form.reset();\n      status.textContent = form.dataset.successMessage;\n    } catch (error) {\n      status.textContent = errorMessage;\n    } finally {\n      form.removeAttribute('aria-busy');\n      button.disabled = false;\n      button.textContent = buttonLabel;\n    }\n  });\n})();\n<\u002Fscript>\n</body></html>"
